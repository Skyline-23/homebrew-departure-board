name: Validate
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  native:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install swiftlint
      - run: ./script/lint.sh
      - run: node script/test-downloads.mjs
      - run: ./script/build.sh
      - run: ./script/validate.sh
      - uses: actions/upload-artifact@v4
        with:
          name: board-previews
          path: work/validation-previews/*.png
