name: Release Departure Board
on:
  push:
    tags: ['v*']
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node script/test-downloads.mjs
      - run: node --check script/verify-site.mjs
      - name: Generate Open Graph images
        run: |
          if ! fc-list :lang=ko | grep -q .; then sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk; fi
          python3 script/build-og-preview.py --render
      - run: python3 script/build-site.py
      - run: python3 script/check-guide.py
      - uses: actions/upload-artifact@v4
        with:
          name: OpenGraph
          path: site/og-*-v1.png
  windows:
    uses: ./.github/workflows/windows.yml
    permissions:
      contents: read
  macos:
    runs-on: macos-15
    environment: macos-release
    timeout-minutes: 45
    env:
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      HOMEBREW_NO_AUTO_UPDATE: 1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Install SwiftLint
        run: command -v swiftlint >/dev/null || brew install swiftlint
      - name: Check source style
        run: ./script/lint.sh
      - name: Import Developer ID certificate
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: ./script/import-signing-certificate.sh
      - name: Build and sign
        run: ./script/build.sh
      - name: Validate application and screen saver
        run: ./script/validate.sh
      - name: Notarize and staple
        env:
          APP_STORE_CONNECT_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_P8_BASE64 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: ./script/notarize.sh
      - name: Package notarized bundles
        run: ./script/package.sh
      - name: Notarize the macOS disk image
        env:
          APP_STORE_CONNECT_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_P8_BASE64 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: ./script/notarize.sh "outputs/DepartureBoard/dist/DepartureBoard-$VERSION-universal.dmg"
      - name: Verify the final download
        run: ./script/validate-distribution.sh
      - name: Add a stable latest-download filename
        run: |
          cp "outputs/DepartureBoard/dist/DepartureBoard-$VERSION-universal.zip" outputs/DepartureBoard/dist/DepartureBoard-universal.zip
          cp "outputs/DepartureBoard/dist/DepartureBoard-$VERSION-universal.dmg" outputs/DepartureBoard/dist/DepartureBoard-universal.dmg
          cd outputs/DepartureBoard/dist
          shasum -a 256 DepartureBoard-universal.dmg > DepartureBoard-universal.dmg.sha256
      - name: Upload verified macOS packages
        uses: actions/upload-artifact@v4
        with:
          name: DepartureBoard-macos
          path: outputs/DepartureBoard/dist/
      - name: Remove temporary signing keychain
        if: always()
        run: |
          if [[ -n "${CODE_SIGN_KEYCHAIN:-}" ]]; then
            security delete-keychain "$CODE_SIGN_KEYCHAIN"
          fi
  release:
    needs: [site, windows, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Download verified macOS packages
        uses: actions/download-artifact@v4
        with:
          name: DepartureBoard-macos
          path: outputs/DepartureBoard/dist
      - name: Download tested Windows packages
        uses: actions/download-artifact@v4
        with:
          pattern: DepartureBoard-win-*
          path: work/windows-release
          merge-multiple: true
      - name: Download generated Open Graph images
        uses: actions/download-artifact@v4
        with:
          name: OpenGraph
          path: site
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state="$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null || echo missing)"
          if [[ "$state" == false ]]; then
            gh release download "$GITHUB_REF_NAME" \
              --pattern "DepartureBoard-$VERSION-universal.zip" \
              --pattern "DepartureBoard-$VERSION-source.tar.gz" \
              --dir outputs/DepartureBoard/dist --clobber
          else
            if [[ "$state" == missing ]]; then
              gh release create "$GITHUB_REF_NAME" --draft \
                --title "Departure Board $VERSION" \
                --notes-file .github/RELEASE_NOTES.md --generate-notes
            fi
            gh release upload "$GITHUB_REF_NAME" --clobber \
              "outputs/DepartureBoard/dist/DepartureBoard-$VERSION-universal.zip" \
              outputs/DepartureBoard/dist/DepartureBoard-universal.zip \
              "outputs/DepartureBoard/dist/DepartureBoard-$VERSION-universal.dmg" \
              outputs/DepartureBoard/dist/DepartureBoard-universal.dmg \
              outputs/DepartureBoard/dist/DepartureBoard-universal.dmg.sha256 \
              "outputs/DepartureBoard/dist/DepartureBoard-$VERSION-source.tar.gz" \
              work/windows-release/*.zip work/windows-release/*.exe work/windows-release/*.sha256
            gh release edit "$GITHUB_REF_NAME" --draft=false --latest
          fi
      - name: Update Homebrew tap
        run: |
          git fetch origin main
          git checkout -B update-cask origin/main
          python3 script/update_tap.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/departure-board.rb Formula/departure-board.rb site/og-*-v1.png
          git diff --cached --quiet && exit 0
          git commit -m "chore(release): Update Homebrew to $VERSION" -m "- Point the cask and formula at the validated $VERSION release"
          git push origin HEAD:main
  website:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Verify automatic website deployment and GitHub downloads
        run: node script/verify-site.mjs "${GITHUB_REF_NAME#v}"
