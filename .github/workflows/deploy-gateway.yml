name: Deploy flight-data gateway
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['server/**', '.github/workflows/deploy-gateway.yml']
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: flight-data
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Check deployment credentials
        id: credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AERODATABOX_API_KEY: ${{ secrets.AERODATABOX_API_KEY }}
          BOARD_ACCESS_TOKEN: ${{ secrets.BOARD_ACCESS_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && [ -n "$AERODATABOX_API_KEY" ] && [ -n "$BOARD_ACCESS_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Configure the four flight-data environment secrets to enable deployment."
          fi
      - name: Deploy Worker and runtime secrets
        if: steps.credentials.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: server
          secrets: |
            AERODATABOX_API_KEY
            BOARD_ACCESS_TOKEN
        env:
          AERODATABOX_API_KEY: ${{ secrets.AERODATABOX_API_KEY }}
          BOARD_ACCESS_TOKEN: ${{ secrets.BOARD_ACCESS_TOKEN }}
