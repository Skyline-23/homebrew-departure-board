name: Windows preview
on:
  push:
    branches: [main]
    paths: ['Windows/**', 'Resources/**', '.github/workflows/windows.yml']
  pull_request:
    paths: ['Windows/**', 'Resources/**', '.github/workflows/windows.yml']
  workflow_dispatch:
  workflow_call:
concurrency:
  group: windows-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            runtime: win-x64
          - runner: windows-11-arm
            runtime: win-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Read package version
        run: |
          $project = [xml](Get-Content Windows/DepartureBoard.Windows/DepartureBoard.Windows.csproj)
          $version = $project.Project.PropertyGroup.Version | Select-Object -First 1
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $version = $env:GITHUB_REF_NAME.Substring(1)
            if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Expected a semantic release tag.' }
            $version += '-preview.1'
          }
          "DEPARTURE_BUILD_VERSION=$version" >> $env:GITHUB_ENV
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Cache NuGet and formatter packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Windows/**/*.csproj', 'Windows/.config/dotnet-tools.json') }}
          restore-keys: nuget-${{ runner.os }}-${{ runner.arch }}-
      - name: Cache installer compiler download
        uses: actions/cache@v4
        with:
          path: ${{ runner.tool_cache }}/departure-board/innosetup-6.7.4.exe
          key: innosetup-${{ runner.os }}-${{ runner.arch }}-6.7.4
      - name: Check C# formatting
        run: |
          dotnet tool restore --tool-manifest Windows/.config/dotnet-tools.json
          python script/build-guide.py --check
          python script/check-guide.py
          python Windows/scripts/test_format.py
          python Windows/scripts/format.py --check
      - name: Build and test shared logic
        run: |
          dotnet build Windows/DepartureBoard.Core.Tests/DepartureBoard.Core.Tests.csproj -c Release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet run --project Windows/DepartureBoard.Core.Tests -c Release --no-build -- Resources
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Package self-contained preview
        run: ./Windows/scripts/Publish.ps1 -Runtime '${{ matrix.runtime }}' -Version "$env:DEPARTURE_BUILD_VERSION"
      - name: Exercise published screen saver and per-user installer
        run: >-
          ./Windows/scripts/SmokeTest.ps1
          -PackageZip 'work/windows-publish/DepartureBoard-${{ matrix.runtime }}.zip'
          -OutputDirectory "$env:GITHUB_WORKSPACE/work/windows-images"
      - name: Build Windows setup executable
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $compiler)) {
            $tools = Join-Path $env:RUNNER_TOOL_CACHE 'departure-board'
            New-Item -ItemType Directory -Force $tools | Out-Null
            $setup = Join-Path $tools 'innosetup-6.7.4.exe'
            if (!(Test-Path $setup)) {
              Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_4/innosetup-6.7.4.exe' -OutFile $setup
            }
            $signature = Get-AuthenticodeSignature $setup
            if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Pyrsys B.V.') { throw 'Invalid Inno Setup publisher signature.' }
            $p = Start-Process $setup -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP-' -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw 'Could not install the build compiler.' }
          }
          ./Windows/scripts/PackageInstaller.ps1 -Runtime '${{ matrix.runtime }}' -CompilerPath $compiler -Version "$env:DEPARTURE_BUILD_VERSION"
      - name: Test Windows setup and removal
        run: >-
          ./Windows/scripts/TestInstaller.ps1
          -Installer 'work/windows-publish/DepartureBoard-${{ matrix.runtime }}-Setup.exe'
          -OutputDirectory "$env:GITHUB_WORKSPACE/work/installer-validation"
      - name: Upload preview package
        uses: actions/upload-artifact@v4
        with:
          name: DepartureBoard-${{ matrix.runtime }}
          path: |
            work/windows-publish/DepartureBoard-${{ matrix.runtime }}.zip
            work/windows-publish/DepartureBoard-${{ matrix.runtime }}.zip.sha256
            work/windows-publish/DepartureBoard-${{ matrix.runtime }}-Setup.exe
            work/windows-publish/DepartureBoard-${{ matrix.runtime }}-Setup.exe.sha256
      - name: Upload rendered boards
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-boards-${{ matrix.runtime }}
          path: work/windows-images/
      - name: Upload installer validation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Installer-validation-${{ matrix.runtime }}
          path: work/installer-validation/
